name: Build Portfolio - Backend Docker Image
run-name: Build Portfolio - Backend Docker Image

on:
#  push:
#    branches:
#      - V_1.0.0
  pull_request:
    branches:
      - main

  #workflow_dispatch:

  workflow_call:
    inputs:
      workflow_callType:
        type: string
        required: false
        default: 'workflow_dispatch'
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions: { contents: read, packages: write }

jobs:
    build_backend:
      if: github.event_name != 'pull_request'
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repo
          if: ${{ inputs.workflow_callType == 'workflow_dispatch' }}
          uses: actions/checkout@v6
          with:
            path: backend

        - name: Checkout Repo from ${{ inputs.workflow_callType }}
          if: ${{ inputs.workflow_callType == 'workflow_call' }}
          uses: actions/checkout@v6
          with:
            repository: SwaroopAV21/javaProfile
            path: backend

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Extract metadata (tags, labels)
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ secrets.DOCKERHUB_USERNAME }}/backend
            tags: |
              type=ref,event=branch
              type=semver,pattern={{version}}
              type=sha

        - name: Print Images and Tags
          run: |
              echo "Images: ${{ steps.meta.outputs.images }}"
              echo "Tags: ${{ steps.meta.outputs.tags }}"
              echo "Labels: ${{ steps.meta.outputs.labels }}"

        - name: Build and push
          uses: docker/build-push-action@v6
          with:
            context: ${{ github.workspace }}/backend
            push: ${{ github.event_name != 'pull_request' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

    build_database:
      if: github.event_name != 'pull_request'
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repo
          if: ${{ inputs.workflow_callType == 'workflow_dispatch' }}
          uses: actions/checkout@v6
          with:
            path: db

        - name: Checkout Repo from ${{ inputs.workflow_callType }}
          if: ${{ inputs.workflow_callType == 'workflow_call' }}
          uses: actions/checkout@v6
          with:
            repository: SwaroopAV21/javaProfile
            path: db

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Extract metadata (tags, labels)
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ secrets.DOCKERHUB_USERNAME }}/db
            tags: |
              type=ref,event=branch
              type=semver,pattern={{version}}
              type=sha

        - name: Print Images and Tags
          run: |
            echo "Images: ${{ steps.meta.outputs.images }}"
            echo "Tags: ${{ steps.meta.outputs.tags }}"
            echo "Labels: ${{ steps.meta.outputs.labels }}"

        - name: Build and push
          uses: docker/build-push-action@v6
          with:
            context: ${{ github.workspace }}/db/db
            push: ${{ github.event_name != 'pull_request' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max